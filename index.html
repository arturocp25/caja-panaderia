<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13233F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Panadería">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Caja Panadería</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#E9EEF2; --surface:#FFFFFF; --surface-2:#F1F4F8; --ink:#13233F; --ink-2:#44526D; --muted:#6F7C93; --line:#D3DAE3;
  --accent:#0B7A75; --accent-ink:#FFFFFF; --go:#157F3B; --go-ink:#FFFFFF; --warn:#A34A06; --warn-bg:#FCEFDF;
  --danger:#B42318; --danger-bg:#FCE9E7; --ok:#157F3B; --ok-bg:#E4F3E8; --info:#1F5FA8; --info-bg:#E5EEF9;
  --nav:#13233F; --nav-ink:#A9B8D2; --nav-on:#FFFFFF; --flash:#157F3B;
  --series-1:#2a78d6; --series-2:#eb6834; --grid:#E1E5EB; --axis:#C3CAD5;
  --alt:#5B3FB0; --alt-ink:#FFFFFF; --warn-ink:#FFFFFF; --seg-on:#FFFFFF;
  --font:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0C1322; --surface:#152038; --surface-2:#1C2944; --ink:#EEF2F8; --ink-2:#BAC5D8; --muted:#8E9BB2; --line:#2A3A5A;
    --accent:#35B8AE; --accent-ink:#06201E; --go:#23914C; --go-ink:#FFFFFF; --warn:#F0A34A; --warn-bg:#3A2A14;
    --danger:#F0756B; --danger-bg:#3D1C1A; --ok:#4CC27A; --ok-bg:#16301F; --info:#7FB2F0; --info-bg:#172C4A;
    --nav:#080D18; --nav-ink:#8E9BB2; --nav-on:#FFFFFF; --flash:#1C7A40;
    --series-1:#3987e5; --series-2:#d95926; --grid:#24324D; --axis:#33446A;
    --alt:#A897F2; --alt-ink:#170F33; --warn-ink:#2A1700; --seg-on:#34476F;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0C1322; --surface:#152038; --surface-2:#1C2944; --ink:#EEF2F8; --ink-2:#BAC5D8; --muted:#8E9BB2; --line:#2A3A5A;
  --accent:#35B8AE; --accent-ink:#06201E; --go:#23914C; --go-ink:#FFFFFF; --warn:#F0A34A; --warn-bg:#3A2A14;
  --danger:#F0756B; --danger-bg:#3D1C1A; --ok:#4CC27A; --ok-bg:#16301F; --info:#7FB2F0; --info-bg:#172C4A;
  --nav:#080D18; --nav-ink:#8E9BB2; --nav-on:#FFFFFF; --flash:#1C7A40;
  --series-1:#3987e5; --series-2:#d95926; --grid:#24324D; --axis:#33446A;
  --alt:#A897F2; --alt-ink:#170F33; --warn-ink:#2A1700; --seg-on:#34476F;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.15}
.num{font-stretch:78%;font-weight:800;letter-spacing:-.01em}
.tab{font-variant-numeric:tabular-nums}
.hint{color:var(--ink-2);font-size:15px;margin:8px 0 0}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- estructura ---------- */
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--line)}
.biz{flex:1;min-width:0;font-weight:800;font-stretch:72%;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface-2);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok i{background:var(--ok)} .sync.pend i{background:var(--warn)} .sync.err i{background:var(--danger)} .sync.busy i{background:var(--info);animation:pulse 1s infinite alternate}
.sync.demo{background:var(--warn-bg);color:var(--warn)} .sync.demo i{background:var(--warn)}
@keyframes pulse{to{opacity:.3}}
.me{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:4px;border-radius:999px;font-weight:700;font-size:16px}
.av{width:36px;height:36px;border-radius:50%;background:var(--c,#475569);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:16px 16px calc(92px + env(safe-area-inset-bottom))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--nav);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;min-width:0;border:0;background:none;color:var(--nav-ink);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:12.5px;font-weight:600}
.nav button svg{width:25px;height:25px}
.nav button.on{color:var(--nav-on)}
.nav button.on svg{stroke-width:2.4}
.nav.two button{flex-direction:row;justify-content:center;gap:10px;font-size:17px;padding:14px 8px}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border:0;border-radius:12px;background:var(--surface-2);color:var(--ink);font-weight:700;font-size:17px;text-decoration:none;transition:transform .08s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.42}
.btn.go{background:var(--go);color:var(--go-ink)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ink{background:var(--ink);color:var(--surface)}
.btn.danger{background:var(--danger);color:#fff}
.btn.line{background:transparent;border:2px solid var(--line)}
.btn.ghost{background:transparent}
.btn.xl{min-height:64px;font-size:20px;width:100%}
.btn.sm{min-height:42px;font-size:15px;padding:0 14px}
.btn.wide{width:100%}
.btn svg{width:22px;height:22px}
.icon-btn{width:48px;height:48px;border:0;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:22px;font-weight:700;flex:none}
.icon-btn:disabled{opacity:.3}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>.btn{flex:1 1 140px}

.lbl{font-size:15px;font-weight:700;color:var(--ink-2);margin:18px 0 8px}
.lbl:first-child{margin-top:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;min-height:48px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:650;font-size:16px;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip.add{border-style:dashed;color:var(--accent);border-color:var(--accent)}
.chip.sm{min-height:40px;font-size:15px;padding:0 13px}

label.f{display:block;margin-bottom:14px}
label.f>span,.f-t{display:block;font-size:14px;font-weight:650;color:var(--ink-2);margin-bottom:6px}
.inp,label.f input,label.f select,label.f textarea{width:100%;min-height:52px;border:2px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface);color:var(--ink);font-size:18px}
label.f textarea{padding:12px 14px;min-height:80px;resize:vertical}
.inp:focus,label.f input:focus,label.f select:focus,label.f textarea:focus{outline:none;border-color:var(--accent)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:12px;min-height:52px;font-weight:600}
.check input{width:26px;height:26px;accent-color:var(--accent);flex:none}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--surface-2);padding:5px;border-radius:14px}
.seg button{min-height:48px;border:0;border-radius:10px;background:transparent;font-weight:700;font-size:16px;color:var(--ink-2)}
.seg.g2{grid-auto-flow:row;grid-template-columns:1fr 1fr}
.seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgba(19,35,63,.18)}

.step{display:flex;align-items:center;gap:6px}
.step button{width:52px;height:52px;border-radius:12px;border:0;background:var(--surface-2);font-size:26px;font-weight:700}
.step input{flex:1;min-width:0;height:52px;text-align:center;border:2px solid var(--line);border-radius:12px;font-size:22px;font-weight:700;background:var(--surface);color:var(--ink)}

/* ---------- vender ---------- */
.venta{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.venta>*,.two-col>*{min-width:0}
.prods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prod{--pt:#fff;position:relative;display:flex;flex-direction:column;min-height:168px;border-radius:20px;background:var(--pc);color:var(--pt);overflow:hidden;box-shadow:inset 0 -5px 0 rgba(0,0,0,.16)}
.prod-tap{flex:1;display:grid;grid-template-rows:auto 1fr auto;gap:2px;border:0;background:none;color:inherit;text-align:left;padding:14px 14px 8px;transition:transform .07s}
.prod-tap:active{transform:scale(.96)}
.prod-name{font-weight:800;font-size:19px;line-height:1.08;font-stretch:88%}
.prod-qty{align-self:end;font-size:68px;line-height:.9;font-weight:850;font-stretch:70%;opacity:.38}
.prod.has .prod-qty{opacity:1}
.prod-price{font-size:15px;font-weight:600;opacity:.92}
.prod-ctrl{display:flex;border-top:1px solid color-mix(in srgb, var(--pt) 26%, transparent)}
.prod-ctrl button{flex:1;height:50px;border:0;background:none;color:inherit;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.prod-ctrl button+button{border-left:1px solid color-mix(in srgb, var(--pt) 26%, transparent)}
.prod-ctrl button:active{background:rgba(0,0,0,.14)}
.prod-ctrl svg{width:20px;height:20px;flex:none}
.prod-ctrl .minus{font-size:30px;font-weight:600;line-height:1}
.prod.bump .prod-qty{animation:bump .18s ease-out}
@keyframes bump{50%{transform:scale(1.14)}}

.cli-card{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:4px}
.cli-card .who-t{flex:1 1 160px;min-width:0}
.cli-card b{display:block;font-size:18px}
.cli-card small{color:var(--ink-2);font-size:14px}
.debe{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-weight:750;padding:8px 12px;min-height:44px}
.debe u{text-decoration:none;background:var(--warn);color:var(--surface);padding:4px 10px;border-radius:8px}
.pedido-btn{width:100%;justify-content:flex-start;text-align:left;line-height:1.2;padding:10px 14px}

.metodos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metodo{display:flex;align-items:center;gap:10px;min-height:58px;padding:0 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;color:var(--ink-2);text-align:left;line-height:1.1}
.metodo svg{width:24px;height:24px;flex:none}
.metodo.on{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.metodo.on.m-fiado{border-color:var(--warn);background:var(--warn);color:var(--warn-ink)}
.metodo.on.m-danado{border-color:var(--alt);background:var(--alt);color:var(--alt-ink)}
.cambio{display:flex;align-items:baseline;justify-content:space-between;margin-top:8px;padding:12px 16px;border-radius:14px;background:var(--ok-bg);color:var(--ok)}
.cambio span{font-weight:700}
.cambio b{font-size:34px;font-weight:850;font-stretch:75%}
.cambio.bad{background:var(--danger-bg);color:var(--danger)}

.ticket-lines{display:none}
.paybar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:25;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 20px -14px rgba(19,35,63,.5)}
.paytot{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1}
.paytot span{font-size:14px;font-weight:650;color:var(--ink-2)}
.paytot b{font-size:34px;font-weight:850;font-stretch:72%;margin-top:3px}
.paybar .go{min-height:60px;font-size:18px;padding:0 20px}
.paybar .clear{min-height:60px;padding:0 10px;color:var(--ink-2)}
.scr-venta{padding-bottom:calc(180px + env(safe-area-inset-bottom))}

/* ---------- tarjetas y listas ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h3,.sec{font-size:16px;font-weight:750;margin:0 0 10px}
.sec{margin:22px 2px 10px;color:var(--ink-2);font-size:15px}
.hero{padding:18px 18px 16px;border-radius:18px;background:var(--ink);color:var(--surface);margin-bottom:12px}
.hero span{display:block;font-size:15px;font-weight:650;opacity:.8}
.hero b{display:block;font-size:56px;line-height:1;font-weight:850;font-stretch:72%;margin:6px 0 6px}
.hero small{font-size:15px;opacity:.85}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.stat span{display:block;font-size:14px;color:var(--ink-2);font-weight:600}
.stat b{display:block;font-size:26px;font-weight:850;font-stretch:76%;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.stat.warn b{color:var(--warn)} .stat.good b{color:var(--ok)} .stat.bad b{color:var(--danger)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:11px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:var(--ink)}
.row:first-child{border-top:0}
button.row:active{background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row .t1{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{display:block;font-size:14px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:800;font-size:18px;font-stretch:85%;text-align:right;white-space:nowrap}
.row .amt small{display:block;font-size:13px;font-weight:600;color:var(--muted);font-stretch:100%}
.list.wrap .t1,.list.wrap .t2,.bars-list .t2{white-space:normal}
.row.void .t1,.row.void .amt{text-decoration:line-through;color:var(--muted)}
.time{font-size:15px;font-weight:700;color:var(--ink-2);width:46px;flex:none}
.dot{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none}
.badge{display:inline-block;font-size:12.5px;font-weight:750;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);vertical-align:1px}
.badge.efectivo{background:var(--ok-bg);color:var(--ok)}
.badge.transferencia{background:var(--info-bg);color:var(--info)}
.badge.fiado,.badge.credito{background:var(--warn-bg);color:var(--warn)}
.badge.void{background:var(--danger-bg);color:var(--danger)}
.empty{padding:22px 16px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

.daynav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.daynav-t{flex:1;text-align:center}
.daynav-t b{display:block;font-size:20px}
.daynav-t span{font-size:14px;color:var(--ink-2)}
.caja{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.caja .grow{flex:1 1 180px}
.caja .grow b{display:block;font-size:30px;font-weight:850;font-stretch:76%}
.cuadre{display:inline-block;margin-top:4px;font-weight:700;font-size:15px}
.cuadre.ok{color:var(--ok)} .cuadre.bad{color:var(--danger)}

/* barras de listas */
.bars-list .row{flex-wrap:wrap;row-gap:6px}
.bar{flex-basis:100%;height:10px;border-radius:0 4px 4px 0;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--c, var(--series-2))}

/* insumos */
.ins-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.ins{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:76px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left}
.ins b{font-size:17px}
.ins span{font-size:14px;color:var(--ink-2)}
.ins:active{background:var(--surface-2)}

/* ---------- gráfico ---------- */
.chart{position:relative}
.legend{display:flex;gap:16px;font-size:14px;color:var(--ink-2);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.plot{position:relative;height:180px;margin-left:40px}
.gl{position:absolute;left:0;right:0;border-top:1px solid var(--grid)}
.gl.base{border-top-color:var(--axis)}
.gl span{position:absolute;right:calc(100% + 6px);top:-8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cols{position:absolute;inset:0;display:flex;align-items:flex-end}
.col{flex:1;min-width:0;height:100%;display:flex;justify-content:center;align-items:flex-end;gap:2px;position:relative;border:0;background:none;padding:0}
.col i{display:block;width:min(12px, 42%);border-radius:4px 4px 0 0;min-height:1px}
.col i.b1{background:var(--series-1)} .col i.b2{background:var(--series-2)}
.col.hl{background:color-mix(in srgb, var(--ink) 6%, transparent)}
.xlab{display:flex;margin-left:40px;margin-top:6px}
.xlab span{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--muted);white-space:nowrap;overflow:visible}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:0 8px 24px -10px rgba(0,0,0,.35);font-size:13px;min-width:150px}
.tip .h{color:var(--ink-2);margin-bottom:4px}
.tip .r{display:flex;align-items:center;gap:8px}
.tip .r i{width:12px;height:2px;background:var(--c)}
.tip .r b{font-size:15px}
.tip .r span{color:var(--ink-2)}
table.tbl{width:100%;border-collapse:collapse;font-size:15px}
table.tbl th,table.tbl td{padding:8px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.tbl th:first-child,table.tbl td:first-child{text-align:left}
table.tbl th{font-size:13px;color:var(--ink-2);font-weight:650;border-top:0}

/* ---------- hojas (ventanas) ---------- */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(8,14,28,.52);animation:fade .15s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out;overscroll-behavior:contain}
#kp-root .sheet-bg{z-index:60} #kp-root .sheet{z-index:61}
.sh-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sh-head h2{flex:1;font-size:21px}
.sh-head p{margin:2px 0 0;color:var(--ink-2);font-size:15px}
.sh-actions{display:flex;flex-direction:column;gap:8px;margin-top:18px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.kp-display{font-size:46px;font-weight:850;font-stretch:72%;text-align:right;padding:6px 8px 12px;min-height:72px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kp button{height:64px;border:0;border-radius:14px;background:var(--surface-2);font-size:28px;font-weight:700}
.kp button:active{background:var(--line)}
.kp button[data-k="C"],.kp button[data-k="000"]{font-size:20px}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 6px}
.detail dt{color:var(--ink-2);font-size:15px}
.detail dd{margin:0;font-weight:650;text-align:right}
.big-amt{font-size:44px;font-weight:850;font-stretch:72%;margin:2px 0 10px}
.notice{padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:15px;margin:8px 0}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.err{background:var(--danger-bg);color:var(--danger)}
.notice.ok{background:var(--ok-bg);color:var(--ok)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:44px;height:44px;border-radius:12px;border:3px solid transparent;background:var(--c)}
.swatches button.on{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--surface)}

/* ---------- inicio y quién vende ---------- */
.setup{max-width:520px;margin:0 auto;padding:28px 18px 40px}
.logo{width:76px;height:76px;border-radius:22px;background:var(--ink);display:grid;place-items:center;margin-bottom:18px}
.setup h1{font-size:34px;font-weight:850;font-stretch:76%;margin-bottom:8px}
.setup>p{color:var(--ink-2);margin:0 0 20px}
.who-wrap{max-width:900px;margin:0 auto;padding:34px 18px 40px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
.who-wrap h1{font-size:34px;font-weight:850;font-stretch:76%;margin-bottom:4px}
.who-wrap>p{color:var(--ink-2);margin:0 0 20px}
.who-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.who{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:150px;padding:16px;border-radius:20px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);text-align:left}
.who .av{width:58px;height:58px;font-size:24px}
.who b{font-size:22px}
.who .role{font-size:15px;color:var(--ink-2)}
.who:active{transform:scale(.97)}

/* ---------- avisos ---------- */
#toast{position:fixed;left:12px;right:12px;bottom:calc(142px + env(safe-area-inset-bottom));z-index:70;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:14px;background:var(--ink);color:var(--surface);font-weight:650;box-shadow:0 12px 30px -12px rgba(0,0,0,.5);transform:translateY(20px);opacity:0;pointer-events:none;transition:all .18s;max-width:560px;margin:0 auto}
#toast.show{transform:none;opacity:1;pointer-events:auto}
#toast .msg{flex:1;min-width:0}
#toast .acts{display:flex;gap:6px;flex:none}
#toast button{border:0;border-radius:10px;background:var(--surface);color:var(--ink);font-weight:800;padding:10px 12px}
body.no-paybar #toast{bottom:calc(80px + env(safe-area-inset-bottom))}
.flash{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:var(--flash);color:#fff;animation:fade .12s;transition:opacity .3s}
.flash.out{opacity:0}
.flash div{text-align:center}
.flash svg{width:120px;height:120px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.flash b{display:block;font-size:44px;font-weight:850;font-stretch:76%;margin-top:8px}
.flash span{display:block;font-size:20px;font-weight:650;opacity:.9}

.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;border-radius:14px;background:var(--warn-bg);color:var(--ink);margin-bottom:12px}
.banner .grow{flex:1 1 200px;min-width:0}
.banner b{display:block;font-size:17px}
.banner span{display:block;font-size:15px;color:var(--ink-2);margin-top:2px}

.cuentas{margin-top:4px}
.den{display:flex;align-items:center;gap:10px;padding:5px 0}
.den .step{flex:1;min-width:0;max-width:190px}
.den .step button{width:46px;height:46px;font-size:24px}
.den .step input{height:46px;font-size:20px;min-width:0}
.bill{width:74px;height:40px;flex:none;display:grid;place-items:center;border-radius:6px;border:2px solid var(--line);background:var(--surface-2);font-weight:800;font-stretch:85%;font-size:17px;font-variant-numeric:tabular-nums}
.coin{width:74px;flex:none;display:grid;place-items:center}
.coin i{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface-2);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:16px}

.den-sub.has{color:var(--ink)}
.den-t{margin-top:14px}
.sheet-foot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));z-index:2;display:flex;align-items:center;gap:12px;margin:14px -16px calc(-20px - env(safe-area-inset-bottom));padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.cnt-tot{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1}
.cnt-tot span{font-size:14px;color:var(--ink-2);font-weight:650}
.cnt-tot b{font-size:34px;font-weight:850;font-stretch:72%;margin-top:4px;white-space:nowrap}
.sheet-foot .btn{min-height:60px;font-size:18px;padding:0 22px}
.notice.sug{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.notice.sug span{flex:1 1 160px}

.seg.modos{margin-bottom:10px}
.seg.modos button{font-size:17px;min-height:52px}

.prod.off{opacity:.3}
.prod-also{font-size:14px;font-weight:700;margin-top:2px}
.prod.need .prod-price{text-decoration:underline;text-underline-offset:3px;font-weight:750}
.badge.danado{background:color-mix(in srgb, var(--alt) 16%, transparent);color:var(--alt)}
.recibo{white-space:pre-wrap;font-size:14.5px;line-height:1.45;background:var(--surface-2);border-radius:12px;padding:12px 14px;margin:0 0 4px;max-height:260px;overflow:auto}
.formas .row{gap:10px;padding:6px 12px}
.formas .check{min-height:46px}
.inp.precio{width:120px;flex:none;min-height:46px;font-size:17px}
.inp.sueldo{width:110px;flex:none;min-height:46px;text-align:right;font-size:17px}
.row.day-sep{min-height:40px;background:var(--surface-2)}
.row.day-sep .t2{font-weight:700}
.tbl-wrap{overflow-x:auto}

/* ---------- pantallas grandes (tablet) ---------- */
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(580px, calc(100vw - 32px));max-height:88vh;transform:translate(-50%,-50%);border-radius:22px;animation:none}
  .stats{grid-template-columns:repeat(4,1fr)}
  .ins-grid{grid-template-columns:repeat(3,1fr)}
  .who-grid{grid-template-columns:repeat(4,1fr);gap:16px}
  .who{min-height:210px;padding:20px}
  .who .av{width:76px;height:76px;font-size:30px}
  .who b{font-size:26px}
  .who-wrap h1{font-size:44px}
  #toast{bottom:calc(150px + env(safe-area-inset-bottom))}
}
@media (min-width:900px){
  .venta{grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
  .ticket{position:sticky;top:76px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
  .ticket .lbl:first-child{margin-top:0}
  .ticket-lines{display:block;margin:4px 0 0}
  .ticket-lines .row{min-height:44px;padding:8px 0;border-top:1px dashed var(--line)}
  .paybar{position:static;flex-wrap:wrap;padding:14px 0 0;margin-top:12px;box-shadow:none;border-top:2px solid var(--ink);background:transparent}
  .paybar .go{flex-basis:100%;order:3;min-height:68px;font-size:20px}
  .paytot b{font-size:44px}
  .scr-venta{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
  .prods{grid-template-columns:repeat(2,1fr);gap:14px}
  .prod{min-height:210px}
  .prod-qty{font-size:92px}
  .prod-name{font-size:22px}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

/* ================================================================
   Almacenamiento local (IndexedDB, con respaldo en memoria)
   ================================================================ */
const IDB = {
  req: rq => new Promise((res, rej) => { rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }),
  open() {
    return new Promise((res, rej) => {
      const rq = indexedDB.open('panaderia', 1);
      rq.onupgradeneeded = () => {
        const db = rq.result;
        if (!db.objectStoreNames.contains('rec')) db.createObjectStore('rec', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
      };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
      rq.onblocked = () => rej(new Error('blocked'));
    });
  },
  all(db) { return IDB.req(db.transaction('rec').objectStore('rec').getAll()); },
  meta(db) { return IDB.req(db.transaction('meta').objectStore('meta').get('meta')); },
  tx(db, fn) {
    return new Promise((res, rej) => {
      const tx = db.transaction('rec', 'readwrite');
      fn(tx.objectStore('rec'));
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  },
  put(db, recs) { return IDB.tx(db, st => recs.forEach(r => st.put(r))); },
  del(db, ids) { return IDB.tx(db, st => ids.forEach(id => st.delete(id))); },
  putMeta(db, m) { return IDB.req(db.transaction('meta', 'readwrite').objectStore('meta').put(m, 'meta')); },
  clear(db) {
    return new Promise((res, rej) => {
      const tx = db.transaction(['rec', 'meta'], 'readwrite');
      tx.objectStore('rec').clear();
      tx.objectStore('meta').clear();
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }
};

const Store = {
  db: null, ready: false, recs: new Map(), byT: {}, meta: {},
  async init() {
    try { if (window.indexedDB) this.db = await IDB.open(); } catch (e) { this.db = null; }
    if (this.db) {
      try {
        (await IDB.all(this.db)).forEach(r => this._set(r));
        this.meta = (await IDB.meta(this.db)) || {};
      } catch (e) { console.warn(e); }
    }
    if (!this.meta.deviceId) this.meta.deviceId = 'd' + Math.random().toString(36).slice(2, 8);
    if (typeof this.meta.cursor !== 'number') this.meta.cursor = 0;
    const nuevos = [];
    SEMILLAS.forEach(s => {
      const prev = this.recs.get(s.id), su = s.u || 1;
      if (!prev || (prev.d === 'inicio' && n0(prev.u) < su)) {
        const r = Object.assign({}, prev || {}, s, { u: su, s: 0, d: 'inicio' });
        this._set(r);
        nuevos.push(r);
      }
    });
    await this.persist(nuevos);
    await this.saveMeta();
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
    this.ready = true;
  },
  _set(r) { this.recs.set(r.id, r); (this.byT[r.t] || (this.byT[r.t] = new Map())).set(r.id, r); },
  _del(id) { const r = this.recs.get(id); if (!r) return; this.recs.delete(id); if (this.byT[r.t]) this.byT[r.t].delete(id); },
  get(id) { return id ? this.recs.get(id) : undefined; },
  list(t) { return this.byT[t] ? Array.from(this.byT[t].values()) : []; },
  async save(t, data) {
    const prev = data.id ? this.recs.get(data.id) : null;
    const ahora = Date.now();
    const u = prev && prev.u >= ahora ? prev.u + 1 : ahora;
    const r = Object.assign({}, prev || {}, data, { t, id: data.id || uid(t), u, s: 0, d: this.meta.deviceId });
    if (!prev) r.c = u;
    this._set(r);
    await this.persist([r]);
    Sync.soon();
    return r;
  },
  async persist(recs) {
    if (!this.db || !recs.length) return;
    try { await IDB.put(this.db, recs); } catch (e) { toast('No se pudo guardar en este equipo: ' + e.message); }
  },
  async saveMeta() { if (this.db) { try { await IDB.putMeta(this.db, this.meta); } catch (e) {} } },
  pendientes() { let n = 0; for (const r of this.recs.values()) if (r.s === 0 && r.d !== 'inicio') n++; return n; },
  /** Este equipo guarda 13 meses. Lo anterior sigue en la hoja de Google. */
  async podar() {
    const h = hoy();
    if (this.meta.podado === h) return;
    const limite = addDays(h, -DIAS_EN_EQUIPO);
    const cortes = cortesPorCliente();
    const borrar = [];
    for (const r of this.recs.values()) {
      if (!r.dia || r.dia >= limite || r.s !== 1) continue;
      if ((r.t === 'venta' && r.metodo === 'fiado') || r.t === 'cobro' || r.t === 'corte') {
        const c = cortes.get(r.clienteId);
        if (!c || r === c || r.dia > c.dia) continue;
      }
      borrar.push(r.id);
    }
    borrar.forEach(id => this._del(id));
    if (this.db && borrar.length) { try { await IDB.del(this.db, borrar); } catch (e) {} }
    this.meta.podado = h;
    await this.saveMeta();
  },
  async borrarTodo() {
    if (this.db) await IDB.clear(this.db);
    this.recs = new Map(); this.byT = {}; this.meta = {};
  }
};

/* ================================================================
   Sincronización con Google Sheets
   ================================================================ */
const Sync = {
  busy: false, timer: null, error: null,
  configurado() { return !!(Store.meta.api && Store.meta.clave) && !Store.meta.demo; },
  soon(ms) { clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), ms == null ? 1500 : ms); pintarEstado(); },
  async llamar(cuerpo) {
    const res = await fetch(Store.meta.api, { method: 'POST', body: JSON.stringify(cuerpo), redirect: 'follow' });
    let j;
    try { j = await res.json(); } catch (e) { throw new Error('La hoja respondió algo inesperado. Revisa el enlace.'); }
    if (!j.ok) throw new Error(j.error === 'clave' ? 'La clave no coincide con la de la hoja.' : (j.error || 'Error en la hoja'));
    return j;
  },
  async run(opts) {
    opts = opts || {};
    if (this.busy || !this.configurado()) { pintarEstado(); return false; }
    if (!navigator.onLine && !opts.forzar) { pintarEstado(); return false; }
    this.busy = true; pintarEstado();
    let cambiosRemotos = 0;
    try {
      for (let vuelta = 0; vuelta < 60; vuelta++) {
        const enviar = [];
        for (const r of Store.recs.values()) { if (r.s === 0) { enviar.push(r); if (enviar.length >= 150) break; } }
        const j = await this.llamar({
          clave: Store.meta.clave,
          equipo: Store.meta.deviceName || '',
          desde: Store.meta.cursor || 0,
          epoca: Store.meta.epoca || 0,
          completo: !!Store.meta.subirTodo,
          registros: enviar.map(r => { const c = Object.assign({}, r); delete c.s; return c; })
        });
        const cambiados = [];
        const ok = new Set(j.aceptados || []);
        enviar.forEach(r => {
          const actual = Store.recs.get(r.id);
          if (ok.has(r.id) && actual && actual.u === r.u && actual.s === 0) { actual.s = 1; cambiados.push(actual); }
        });
        if (j.reiniciar) {
          // La hoja archivó un año o alguien la tocó a mano: se vuelve a bajar todo.
          Store.meta.cursor = 0;
          Store.meta.epoca = n0(j.epoca);
          if (j.motivo === 'renumerado') {
            const limite = addDays(hoy(), -DIAS_EN_EQUIPO);
            for (const r of Store.recs.values()) {
              if (r.s !== 0 && (!r.dia || r.dia >= limite)) { r.s = 0; cambiados.push(r); }
            }
            Store.meta.subirTodo = true;
          }
        } else {
          (j.registros || []).forEach(rr => {
            const local = Store.recs.get(rr.id);
            if (!local || rr.u > local.u || (rr.u === local.u && local.s !== 0)) {
              const m = Object.assign({}, rr, { s: 1 });
              if (!local || local.u !== rr.u) cambiosRemotos++;
              Store._set(m); cambiados.push(m);
            }
          });
          Store.meta.cursor = n0(j.hasta);
          if (j.epoca) Store.meta.epoca = n0(j.epoca);
        }
        await Store.persist(cambiados);
        let quedan = false;
        for (const r of Store.recs.values()) if (r.s === 0) { quedan = true; break; }
        if (!quedan) Store.meta.subirTodo = false;
        await Store.saveMeta();
        if (!j.mas && !j.reiniciar && !quedan) break;
      }
      this.error = null;
      Store.meta.ultimaSync = Date.now();
      await Store.saveMeta();
    } catch (e) {
      this.error = e.message || String(e);
      if (/Failed to fetch|NetworkError|Load failed/i.test(this.error)) this.error = 'No hay conexión con la hoja.';
    }
    this.busy = false;
    if (cambiosRemotos) renderSeguro(); else pintarEstado();
    return !this.error;
  }
};

function estadoSync() {
  if (Store.meta.demo) return { cls: 'demo', txt: 'Modo de prueba' };
  if (!Sync.configurado()) return { cls: 'off', txt: 'Solo este equipo' };
  const n = Store.pendientes();
  if (Sync.busy) return { cls: 'busy', txt: 'Guardando en la hoja' };
  if (!navigator.onLine) return { cls: 'off', txt: n ? 'Sin internet, ' + n + ' por subir' : 'Sin internet' };
  if (Sync.error) return { cls: 'err', txt: 'Sin sincronizar' };
  if (n) return { cls: 'pend', txt: n + ' por subir' };
  return { cls: 'ok', txt: 'Al día' };
}
function pintarEstado() {
  const el = $('#syncchip');
  if (!el) return;
  const e = estadoSync();

function cortesPorCliente() {
  const m = new Map();
  Store.list('corte').forEach(c => { if (c.anulada) return; const x = m.get(c.clienteId); if (!x || c.dia > x.dia) m.set(c.clienteId, c); });
  return m;
}
function saldos() {
  const cortes = cortesPorCliente();
  const m = new Map();
  cortes.forEach((c, id) => m.set(id, n0(c.monto)));
  const desde = id => { const c = cortes.get(id); return c ? c.dia : ''; };
  Store.list('venta').forEach(v => { if (!v.anulada && v.metodo === 'fiado' && v.clienteId && v.dia > desde(v.clienteId)) m.set(v.clienteId, (m.get(v.clienteId) || 0) + n0(v.total)); });
  Store.list('cobro').forEach(c => { if (!c.anulada && c.clienteId && c.dia > desde(c.clienteId)) m.set(c.clienteId, (m.get(c.clienteId) || 0) - n0(c.monto)); });
  return m;
}

function resumen(d1, d2) {
  const R = {
    ventas: 0, cant: cuenta0(), n: 0, efectivo: 0, transferencia: 0, fiado: 0, cobros: 0, cobrosEf: 0,
    gastos: 0, gastosEf: 0, retiros: 0, retirosEf: 0, cambios: { n: 0, valor: 0, cant: cuenta0() },
    porPan: new Map(), porCajero: new Map(), porCliente: new Map(), porConcepto: new Map(), porDia: new Map()
  };
  const dia = d => { let x = R.porDia.get(d); if (!x) { x = { ventas: 0, gastos: 0 }; R.porDia.set(d, x); } return x; };
  const prods = new Map(productos(true).map(p => [p.id, p]));
  Store.list('venta').forEach(v => {
    if (v.anulada || v.dia < d1 || v.dia > d2) return;
    const total = n0(v.total);
    R.ventas += total; R.n++;
    if (v.metodo === 'efectivo') R.efectivo += total;
    else if (v.metodo === 'transferencia') R.transferencia += total;
    else if (v.metodo === 'fiado') R.fiado += total;
    dia(v.dia).ventas += total;
    (v.items || []).forEach(it => {
      const f = it.f || 'funda', p = prods.get(it.p);
      R.cant[f] += n0(it.q);
      const x = R.porPan.get(it.p) || { nombre: p ? p.nombre : it.n, color: p ? p.color : '#76839A', q: cuenta0(), monto: 0, orden: p ? p.orden : 99 };
      x.q[f] += n0(it.q); x.monto += n0(it.q) * n0(it.pr);
      R.porPan.set(it.p, x);
    });
    const c = R.porCajero.get(v.cajero) || { nombre: v.cajeroNombre, n: 0, monto: 0 };
    c.n++; c.monto += total; R.porCajero.set(v.cajero, c);
    if (v.clienteId) {
      const k = R.porCliente.get(v.clienteId) || { nombre: v.clienteNombre, cant: cuenta0(), monto: 0 };
      const ci = cuentaItems(v.items); ORDEN_FORMAS.forEach(f => { k.cant[f] += ci[f]; });
      k.monto += total; R.porCliente.set(v.clienteId, k);
    }
  });
  R.fundas = R.cant.funda;
  Store.list('cambio').forEach(c => {
    if (c.anulada || c.dia < d1 || c.dia > d2) return;
    R.cambios.n++; R.cambios.valor += n0(c.valor);
    const ci = cuentaItems(c.items); ORDEN_FORMAS.forEach(f => { R.cambios.cant[f] += ci[f]; });
  });
  Store.list('cobro').forEach(c => {
    if (c.anulada || c.dia < d1 || c.dia > d2) return;
    R.cobros += n0(c.monto);
    if (c.metodo === 'efectivo') R.cobrosEf += n0(c.monto);
  });
  Store.list('gasto').forEach(g => {
    if (g.anulada || g.dia < d1 || g.dia > d2) return;
    const m = n0(g.monto);
    if (g.categoria === 'Retiro') {
      R.retiros += m; if (g.metodo === 'efectivo') R.retirosEf += m;
      return;
    }
    R.gastos += m; if (g.metodo === 'efectivo') R.gastosEf += m;
    dia(g.dia).gastos += m;
    const clave = g.categoria === 'Sueldos' ? 'Sueldos' : (g.insumoNombre || g.concepto || 'Otro');
    R.porConcepto.set(clave, (R.porConcepto.get(clave) || 0) + m);
  });
  return R;
}

function periodo(k) {
  const h = hoy(), d = parseDay(h);
  switch (k) {
    case 'hoy': return [h, h, 'Hoy'];
    case 'ayer': { const a = addDays(h, -1); return [a, a, 'Ayer']; }
    case '7d': return [addDays(h, -6), h, 'Últimos 7 días'];
    case '30d': return [addDays(h, -29), h, 'Últimos 30 días'];
    case 'mes': return [dayStr(new Date(d.getFullYear(), d.getMonth(), 1)), h, 'Este mes'];
    case 'mesant': return [dayStr(new Date(d.getFullYear(), d.getMonth() - 1, 1)), dayStr(new Date(d.getFullYear(), d.getMonth(), 0)), 'Mes pasado'];
    case 'ano': return [d.getFullYear() + '-01-01', h, 'Este año'];
    case 'rango': return [ui.rDesde || addDays(h, -6), ui.rHasta || h, 'Fechas elegidas'];
    default: return ['0000-00-00', '9999-99-99', 'Todo'];
  }
}

function quincena(offset) {
  const d = parseDay(hoy());
  let y = d.getFullYear(), m = d.getMonth(), q = d.getDate() <= 15 ? 1 : 2;
  for (let i = 0; i < (offset || 0); i++) { if (q === 2) q = 1; else { q = 2; m--; if (m < 0) { m = 11; y--; } } }
  const fin = q === 1 ? 15 : new Date(y, m + 1, 0).getDate();
  return { clave: y + '-' + pad(m + 1) + '-q' + q, txt: (q === 1 ? '1' : '16') + ' al ' + fin + ' de ' + MESES[m] };
}

function lineasCarrito(cli) {
  const out = [];
  productos().forEach(p => ORDEN_FORMAS.forEach(f => {
    const q = n0(ui.cart[ck(p.id, f)]);
    if (q > 0 && vendePor(p, f)) out.push({ p, f, q, pr: precioDe(p, f, cli) });
  }));
  return out;
}

  else if (ci) h += '<div class="banner calm"><div class="grow"><b>La caja se cerró a las ' + esc(ci.hora) + '</b><span>Lo que vendas ahora no entra en ese conteo. Puedes volver a contar en Hoy.</span></div></div>';

  h += '<div class="venta"><div>';

    '<button class="chip add" data-a="clienteRapido">+ Nuevo</button></div>';
  if (cli) {
    h += '<div class="cli-card"><div class="who-t"><b>' + esc(cli.nombre) + '</b><small>' + esc(cli.tipo || '') +

    }).join('') + '</div>';

  h += '<div class="prods">' + orden.map(p => {
    const f = ui.modo, ok = vendePor(p, f), pr = precioDe(p, f, cli), q = n0(ui.cart[ck(p.id, f)]);
    const otros = ORDEN_FORMAS.filter(g => g !== f && n0(ui.cart[ck(p.id, g)]) > 0).map(g => pl(n0(ui.cart[ck(p.id, g)]), FORMAS[g].uno, FORMAS[g].varios));
    const cls = 'prod' + (q ? ' has' : '') + (!ok ? ' off' : '') + (ok && !pr ? ' need' : '');
    return '<div class="' + cls + '" id="prod-' + p.id + '" style="--pc:' + esc(p.color) + ';--pt:' + textoSobre(p.color) + '">' +

      '<span class="prod-name">' + esc(p.nombre) + '</span><span class="prod-qty">' + q + '</span>' +
      '<span class="prod-price">' + (!ok ? FORMAS[f].no : pr ? money(pr) + ' ' + FORMAS[f].por : 'Falta el precio') + '</span>' +

  if (ui.metodo === 'fiado' && cli) h += '<p class="hint">Se anota en la cuenta de ' + esc(cli.nombre) + (debe > 0 ? ', que ya debe ' + money(debe) : '') + '.</p>';

  }
  h += '<div class="paybar"><button class="btn ghost clear" data-a="limpiar" ' + (nItems ? '' : 'disabled') + '>Borrar</button>' +
    '<div class="paytot"><span>' + (esCambio && nItems ? 'Cambio de ' : '') + esc(cantTxt(cant)) + '</span><b>' + money(total) + '</b></div>' +
    '<button class="btn go" data-a="guardarVenta" ' + (nItems ? '' : 'disabled') + '>' + (esCambio ? 'Guardar cambio' : 'Guardar venta') + '</button></div>';
  h += '</aside></div>';

}

function VPagaCon(total) {
  const r = ui.recibido;
  const billetes = [100, 200, 500, 1000, 2000].filter(b => b > total).slice(0, 3);
  let h = '<div class="lbl">¿Con cuánto paga?</div><div class="chips wrap">' +
    '<button class="chip sm ' + (r === total ? 'on' : '') + '" data-a="recibido" data-v="' + total + '">Exacto</button>' +
    billetes.map(b => '<button class="chip sm ' + (r === b ? 'on' : '') + '" data-a="recibido" data-v="' + b + '">' + money(b) + '</button>').join('') +
    '<button class="chip sm ' + (r && r !== total && !billetes.includes(r) ? 'on' : '') + '" data-a="recibidoOtro">Otro monto</button></div>';
  if (r && r >= total) h += '<div class="cambio"><span>Devolver</span><b>' + money(r - total) + '</b></div>';
  else if (r && r < total) h += '<div class="cambio bad"><span>Faltan</span><b>' + money(total - r) + '</b></div>';
  return h;
}

  h += '<dt>Abrió con</dt>' + (ap ? '<dd>' + money(ap.contado) + '<small>' + esc(ap.hora) + ', ' + esc(ap.cajeroNombre) + '</small></dd>' : '<dd class="muted">Sin contar</dd>');
  if (!ci) {
    h += '<dt>Debería haber ahora</dt><dd class="big">' + money(c.esperado) + '</dd>';
  } else {
    const dif = n0(ci.diferencia);
    h += '<dt>Contado al cerrar</dt><dd>' + money(ci.contado) + '<small>' + esc(ci.hora) + ', ' + esc(ci.cajeroNombre) + '</small></dd>' +

    if (ci.deja != null) h += '<dt>Se dejó para mañana</dt><dd>' + money(ci.deja) + '<small>Se sacaron ' + money(ci.saca) + '</small></dd>';
    const tarde = Store.list('venta').some(v => v.dia === d && !v.anulada && v.metodo === 'efectivo' && v.fecha > ci.fecha);
    if (tarde) h += '</dl><div class="notice warn">Hubo ventas en efectivo después del cierre. Vuelve a contar para incluirlas.</div><dl class="kv">';
  }
  h += '</dl>';
  if (!ci && c.esperado < 0) h += '<p class="hint">Salió más efectivo del que entró. Si algún gasto se pagó con dinero de fuera de la caja, anúlalo y vuelve a anotarlo como «Dinero aparte».</p>';
  h += '<div class="btnrow">';

    h += '<button class="row ' + (g.anulada ? 'void' : '') + '" data-a="verGasto" data-id="' + g.id + '"><span class="grow"><span class="t1">' + esc(g.concepto) + '</span>' +

function VReportes() {

  const porCobrar = sum(Array.from(saldos().values()).filter(v => v > 0));
  const nDias = d1 === '0000-00-00' ? 99 : Math.round((parseDay(d2) - parseDay(d1)) / 864e5) + 1;
  const diasConVenta = Array.from(R.porDia.values()).filter(x => x.ventas > 0).length;

  let h = chipsPeriodo(ui.rper, 'rper', ['30d', '7d', 'hoy', 'mes', 'mesant', 'ano', 'rango']);

      '<label class="f"><span>Hasta</span><input type="date" data-a2="rHasta" value="' + esc(d2) + '"></label></div>';
  }
  h += '<section class="hero" style="margin-top:10px"><span>Ganancia, ' + esc(nombre.toLowerCase()) + '</span><b>' + money(ganancia) + '</b><small>' +
    (!R.ventas ? 'Sin ventas en este periodo' : ganancia >= 0 ? margen + '% de lo vendido se queda como ganancia' : 'Se gastó ' + money(-ganancia) + ' más de lo que se vendió') + '</small></section>';
  if (nDias < 28) h += '<div class="notice">Gastos grandes como el local, la harina o los sueldos se pagan de una vez, así que en pocos días la ganancia sube y baja mucho. Para ver la ganancia real, mira los últimos 30 días.</div>';
  h += '<div class="stats">' + stat('Ventas', R.ventas, '', esc(cantTxt(R.cant))) + stat('Gastos', R.gastos) +
    stat('Cobrado', R.efectivo + R.transferencia + R.cobros, '', 'Efectivo, transferencias y fiado pagado') + stat('Por cobrar', porCobrar, porCobrar ? 'warn' : '', 'Fiado pendiente de todos') +
    stat('Venta media por día', diasConVenta ? R.ventas / diasConVenta : 0, '', pl(diasConVenta, 'día con ventas', 'días con ventas')) +
    stat('Pan cambiado por daño', R.cambios.valor, '', R.cambios.n ? esc(cantTxt(R.cambios.cant)) + ' regalado' : 'Ningún cambio') +
    (R.retiros ? stat('Retiros del dueño', R.retiros, '', 'No cuentan como gasto') : '') + '</div>';

  const dias = [];
  if (d1 !== '0000-00-00') { for (let d = d1; d <= d2 && dias.length < 400; d = addDays(d, 1)) dias.push(d); }
  if (dias.length > 1) h += '<div class="card">' + VGrafico(dias, R) + '</div>';

  h += '<div class="two-col"><div>';
  const conceptos = Array.from(R.porConcepto.entries()).sort((a, b) => b[1] - a[1]);
  h += '<div class="sec">¿Dónde va el dinero?</div><div class="list bars-list">';
  if (!conceptos.length) h += '<div class="empty"><b>No hay gastos anotados</b>Anota las compras en Gastos para ver aquí en qué se va el dinero.</div>';
  const maxC = conceptos.length ? conceptos[0][1] : 1;
  h += conceptos.map(([k, v]) => '<div class="row"><span class="grow"><span class="t1">' + esc(k) + '</span><span class="t2">' +
    Math.round(v / (R.gastos || 1) * 100) + '% de los gastos' + (R.ventas ? ', ' + Math.round(v / R.ventas * 100) + '% de las ventas' : '') + '</span></span>' +
    '<span class="amt">' + money(v) + '</span>' +
    '<span class="bar"><i style="width:' + (v / maxC * 100).toFixed(1) + '%"></i></span></div>').join('') + '</div>';

  h += '<div class="sec">Cómo pagaron</div><div class="list">' + ['efectivo', 'transferencia', 'fiado'].map(m =>
    '<div class="row"><span class="grow"><span class="t1">' + METODO_TXT[m] + '</span></span><span class="amt">' + money(R[m]) + '<small>' + (R.ventas ? Math.round(R[m] / R.ventas * 100) : 0) + '%</small></span></div>').join('') + '</div>';
  h += '</div><div>';

  const pans = Array.from(R.porPan.values()).sort(byOrden);
  if (pans.length) {
    const max = Math.max.apply(null, pans.map(p => p.monto)) || 1;
    h += '<div class="sec">Vendido por producto</div><div class="list bars-list">' + pans.map(p =>
      '<div class="row"><span class="dot" style="--c:' + esc(p.color) + '"></span><span class="grow"><span class="t1">' + esc(p.nombre) + '</span><span class="t2">' +
      esc(cantTxt(p.q)) + '</span></span><span class="amt">' + money(p.monto) + '<small>' + Math.round(p.monto / (R.ventas || 1) * 100) + '% de las ventas</small></span>' +

  if (cajs.length) h += '<div class="sec">Ventas por cajero</div><div class="list">' + cajs.map(c =>

  h += '</div></div>';

  h += '<div class="sec">Descargar</div><div class="btnrow"><button class="btn line" data-a="csv" data-t="venta">Ventas (CSV)</button><button class="btn line" data-a="csv" data-t="gasto">Gastos (CSV)</button></div>';
  h += '<p class="hint">Este equipo guarda los últimos 13 meses. Todo lo anterior sigue en la hoja de Google, en Resumen mensual.</p>';
  return h;
}

function VGrafico(dias, R) {
  let cols = dias.map(d => ({ k: d, label: fechaCorta(d), v: (R.porDia.get(d) || {}).ventas || 0, g: (R.porDia.get(d) || {}).gastos || 0 }));
  if (dias.length > 62) {
    const meses = new Map();
    cols.forEach(c => { const m = c.k.slice(0, 7); const x = meses.get(m) || { k: m, label: MES_CORTO[n0(m.slice(5)) - 1] + ' ' + m.slice(2, 4), v: 0, g: 0 }; x.v += c.v; x.g += c.g; meses.set(m, x); });
    cols = Array.from(meses.values());
  }
  const max = Math.max(1, ...cols.map(c => Math.max(c.v, c.g)));
  const paso = Math.pow(10, Math.floor(Math.log10(max)));
  const tope = Math.ceil(max / paso) * paso;
  const ticks = [0, tope / 2, tope];
  const cada = Math.ceil(cols.length / 7);
  ui._cols = cols;
  let h = '<h3>Ventas y gastos por ' + (dias.length > 62 ? 'mes' : 'día') + '</h3>' +
    '<div class="legend"><span><i style="--c:var(--series-1)"></i>Ventas</span><span><i style="--c:var(--series-2)"></i>Gastos</span></div>';
  if (ui.tabla) {
    h += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>' + (dias.length > 62 ? 'Mes' : 'Día') + '</th><th>Ventas</th><th>Gastos</th><th>Diferencia</th></tr></thead><tbody>' +
      cols.slice().reverse().map(c => '<tr><td>' + esc(c.label) + '</td><td>' + fmt(c.v) + '</td><td>' + fmt(c.g) + '</td><td>' + fmt(c.v - c.g) + '</td></tr>').join('') + '</tbody></table></div>';
  } else {
    h += '<div class="chart"><div class="plot" role="img" aria-label="Ventas y gastos por día">' +
      ticks.map((t, i) => '<div class="gl ' + (i === 0 ? 'base' : '') + '" style="bottom:' + (t / tope * 100) + '%"><span>' + corto(t) + '</span></div>').join('') +
      '<div class="cols">' + cols.map((c, i) =>
        '<button class="col" data-a="tip" data-i="' + i + '" aria-label="' + esc(c.label) + ': ventas ' + money(c.v) + ', gastos ' + money(c.g) + '">' +
        '<i class="b1" style="height:' + (c.v / tope * 100).toFixed(2) + '%"></i><i class="b2" style="height:' + (c.g / tope * 100).toFixed(2) + '%"></i></button>').join('') +
      '</div><div class="tip" id="tip" hidden></div></div>' +
      '<div class="xlab">' + cols.map((c, i) => '<span>' + (i % cada === 0 ? esc(c.label) : '') + '</span>').join('') + '</div></div>';
  }
  h += '<button class="btn ghost sm" data-a="tabla" style="margin-top:6px">' + (ui.tabla ? 'Ver gráfico' : 'Ver como tabla') + '</button>';
  return h;
}

function mostrarTip(i, el) {
  const c = (ui._cols || [])[i];
  const tip = $('#tip');
  if (!c || !tip) return;
  $$('.col.hl').forEach(x => x.classList.remove('hl'));
  el.classList.add('hl');
  tip.innerHTML = '';
  const h = document.createElement('div'); h.className = 'h'; h.textContent = c.label; tip.appendChild(h);
  [['Ventas', c.v, 'var(--series-1)'], ['Gastos', c.g, 'var(--series-2)']].forEach(([n, v, col]) => {
    const r = document.createElement('div'); r.className = 'r';
    const k = document.createElement('i'); k.style.setProperty('--c', col);
    const b = document.createElement('b'); b.textContent = money(v);
    const s = document.createElement('span'); s.textContent = n;
    r.append(k, b, s); tip.appendChild(r);
  });
  tip.hidden = false;
  const plot = el.parentElement.parentElement;
  const x = el.offsetLeft + el.offsetWidth / 2;
  const w = tip.offsetWidth;
  tip.style.left = Math.max(0, Math.min(plot.offsetWidth - w, x - w / 2)) + 'px';
  tip.style.top = '-8px';
}

async function copiarTexto(txt) {

function fechaRecibo(v) {

const fmtCant = n => (Math.round(n * 100) / 100).toLocaleString('en-US');
function unidadTxt(n, u) {
  if (!u) return fmtCant(n);
  if (n === 1) return '1 ' + u;
  const p = u.split(' '), w = p[0];
  p[0] = /[aeiou]$/i.test(w) ? w + 's' : /ón$/.test(w) ? w.slice(0, -2) + 'ones' : w + 'es';
  return fmtCant(n) + ' ' + p.join(' ');
}

function descargar(nombre, contenido, tipo) {
  if (VISTA_PREVIA) return toast('Las descargas funcionan en la app instalada, no en la vista previa.');
  const blob = new Blob([contenido], { type: tipo });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
function exportarCSV(t) {
  const [d1, d2] = periodo(ui.rper);
  const celda = v => { const s = String(v == null ? '' : v); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  let filas;
  if (t === 'venta') {
    filas = [['Recibo', 'Día', 'Hora', 'Cajero', 'Cliente', 'Detalle', 'Fundas', 'Sueltos', 'Cajas', 'Total', 'Método', 'Anulada']].concat(
      Store.list('venta').filter(v => v.dia >= d1 && v.dia <= d2).sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)))
        .map(v => [v.num || '', v.dia, v.hora, v.cajeroNombre, v.clienteNombre, v.detalle, n0(v.fundas), n0(v.sueltos), n0(v.cajas), v.total, METODO_TXT[v.metodo], v.anulada ? 'Sí' : 'No']));
  } else {
    filas = [['Día', 'Concepto', 'Categoría', 'Monto', 'Pagado con', 'Anotó', 'Anulado']].concat(
      Store.list('gasto').filter(g => g.dia >= d1 && g.dia <= d2).sort((a, b) => a.dia.localeCompare(b.dia))
        .map(g => [g.dia, g.concepto, g.categoria, g.monto, pagoTxt(g.metodo), g.cajeroNombre, g.anulada ? 'Sí' : 'No']));
  }
  descargar((t === 'venta' ? 'ventas-' : 'gastos-') + d1 + '-a-' + d2 + '.csv', '﻿' + filas.map(f => f.map(celda).join(',')).join('\n'), 'text/csv;charset=utf-8');
}

      if (k === 0 && ci > 0) return;
      const items = Object.keys(c.pedido).map(pid => { const p = Store.get(pid); return { p: pid, n: p.nombre, f: 'funda', q: c.pedido[pid] + (rnd() < .3 ? 1 : 0), pr: c.precio || p.precio }; });
      venta(dia, '0' + (6 + ci) + ':' + pad(Math.floor(rnd() * 59)), pick(caj), c, items, c.tipo === 'Colmado' ? 'fiado' : 'efectivo');
    });
    const n = k === 0 ? 7 : 14 + Math.floor(rnd() * 8);
    for (let j = 0; j < n; j++) {
      const its = [];
      if (rnd() < .3) {
        const p = pick(productos().filter(x => vendePor(x, 'unidad')));
        its.push({ p: p.id, n: p.nombre, f: 'unidad', q: 2 + Math.floor(rnd() * 5), pr: p.precioUnidad });
      } else {
        const cuantos = rnd() < .65 ? 1 : 2;
        for (let x = 0; x < cuantos; x++) { const p = pick(prods); if (!its.find(i => i.p === p.id)) its.push({ p: p.id, n: p.nombre, f: 'funda', q: rnd() < .8 ? 1 : 2, pr: p.precio }); }
      }
      if (rnd() < .05) its.push({ p: 'prod-galletas', n: 'Galletas (ejemplo)', f: 'caja', q: 1, pr: 250 });
      const hh = 7 + Math.floor(rnd() * horas);
      venta(dia, pad(hh) + ':' + pad(Math.floor(rnd() * 59)), pick(caj), null, its, rnd() < .82 ? 'efectivo' : 'transferencia');
    }
    if (k % 4 === 1) {
      const c = cl[k % 2], p = Store.get('prod-agua');
      const items = [{ p: p.id, n: p.nombre, f: 'funda', q: 1, pr: p.precio }];
      add('cambio', { dia, hora: '08:15', fecha: dia + 'T08:15:00', cajero: 'emp-stefania', cajeroNombre: 'Stefania', clienteId: c.id, clienteNombre: c.nombre, items, detalle: items.map(itemTxt).join(', '), fundas: 1, sueltos: 0, cajas: 0, valor: p.precio });
    }
    if (dow === 1) { gastoDe(dia, 'ins-harina', 6); gastoDe(dia, 'ins-gas', 1); gastoDe(dia, 'ins-mantequilla', 2); gastoDe(dia, 'ins-manteca', 2); gastoDe(dia, 'ins-sal', 14, 'efectivo'); gastoDe(dia, 'ins-azucar', 28); }
    if (dom % 20 === 3) gastoDe(dia, 'ins-levadura', 1, 'transferencia');
    if (dom === 2 || dom === 17) { gastoDe(dia, 'ins-fundas', 1); gastoDe(dia, 'ins-mejorante', 1); }
    if (dow === 3) add('gasto', { dia, fecha: dia + 'T10:00:00', insumoId: 'ins-gasolina', insumoNombre: 'Gasolina de envíos', concepto: 'Gasolina de envíos', categoria: 'Transporte', monto: 400, metodo: 'efectivo', cajero: 'emp-daniel', cajeroNombre: 'Daniel' });
    if (dom === 1) gastoDe(dia, 'ins-local', 1, 'transferencia');
    if (dom === 5) gastoDe(dia, 'ins-luz', 1);
    if (dom === 15 || dom === finMes) {
      const q = (dom === 15 ? '1 al 15' : '16 al ' + finMes) + ' de ' + MESES[dd.getMonth()];
      empleados().filter(e => e.sueldo).forEach(e => add('gasto', { dia, fecha: dia + 'T18:00:00', concepto: 'Sueldo de ' + e.nombre + ' (' + q + ')', categoria: 'Sueldos', empleadoId: e.id, empleadoNombre: e.nombre, periodo: 'demo-' + dia, periodoTxt: q, monto: e.sueldo, metodo: 'aparte', cajero: 'emp-dana', cajeroNombre: 'Dana' }));
    }
    if (dow === 6) {
      cl.slice(0, 2).forEach(c => {
        const s = saldos().get(c.id) || 0;
        if (s > 0) add('cobro', { dia, hora: '17:30', fecha: dia + 'T17:30:00', clienteId: c.id, clienteNombre: c.nombre, monto: s - (rnd() < .5 ? 0 : 1000), metodo: rnd() < .5 ? 'efectivo' : 'transferencia', cajero: 'emp-aneudy', cajeroNombre: 'Aneudy' });
      });
    }
    if (k > 0) {
      const c = cuentaCaja(dia), cierra = pick(caj);
      const contado = Math.max(0, c.esperado - (rnd() < .2 ? 100 : 0));
      add('caja', { id: 'caja-' + dia + '-cierre', dia, momento: 'cierre', hora: '20:1' + Math.floor(rnd() * 9), fecha: dia + 'T20:15:00', cajero: cierra.id, cajeroNombre: cierra.nombre, contado, conteo: desglose(contado),
        esperado: c.esperado, diferencia: contado - c.esperado, abrio: c.abrio, ventasEf: c.ventasEf, cobrosEf: c.cobrosEf, gastosEf: c.gastosEf, retirosEf: c.retirosEf, deja: Math.min(2000, contado), saca: contado - Math.min(2000, contado) });
    }
  }
  await Store.persist(recs);
  await Store.saveMeta();
}

/* ================================================================
   Arranque y eventos
   ================================================================ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const f = A[el.dataset.a];
  if (!f) return;
  if (el.tagName !== 'A') e.preventDefault();
  Promise.resolve(f(el.dataset, el, e)).catch(err => { console.error(err); toast('Algo falló: ' + err.message); });
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.bind) ui[el.dataset.bind] = el.value;
  if (el.dataset && (el.dataset.den !== undefined || el.id === 'cnt-monto')) sumarConteo();
  if (el.hasAttribute && el.hasAttribute('data-calc')) {
    const q = n0(val('g-cant')), p = n0(val('g-precio'));
    const t = $('#g-total'); if (t) t.value = Math.round(q * p * 100) / 100;
    const ins = $('[data-a="guardarGasto"]'); const w = $('#g-recordar-w');
    if (w && ins) { const i = Store.get(ins.dataset.id); w.hidden = !i || p === n0(i.costo); }
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.a2) { ui[el.dataset.a2] = el.value; render(); }
});
document.addEventListener('focusout', () => { setTimeout(() => { if (renderPendiente && !$('#sheet-root').innerHTML && !KP.isOpen()) { const a = document.activeElement; if (!a || !/INPUT|TEXTAREA|SELECT/.test(a.tagName)) { renderPendiente = false; render(); } } }, 50); });
document.addEventListener('keydown', e => {
  if (KP.isOpen()) {
    if (/^\d$/.test(e.key)) { KP.key(e.key); e.preventDefault(); }
    else if (e.key === 'Backspace') { KP.key('back'); e.preventDefault(); }
    else if (e.key === 'Enter') { KP.ok(); e.preventDefault(); }
    else if (e.key === 'Escape') KP.close();
  } else if (e.key === 'Escape' && $('#sheet-root').innerHTML) Sheet.close();
});
document.addEventListener('pointerover', e => { const c = e.target.closest && e.target.closest('.col'); if (c && e.pointerType === 'mouse') mostrarTip(n0(c.dataset.i), c); });
document.addEventListener('focusin', e => { const c = e.target.closest && e.target.closest('.col'); if (c) mostrarTip(n0(c.dataset.i), c); });
window.addEventListener('online', () => { Sync.soon(200); });
window.addEventListener('offline', pintarEstado);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (ui.dia !== hoy() && ui.screen !== 'hoy') ui.dia = hoy(); Store.podar(); Sync.soon(300); } });
setInterval(() => { if (document.visibilityState === 'visible') Sync.run(); }, 30000);

async function arrancar() {
  await Store.init();
  const q = new URLSearchParams(location.search);
  if (q.get('api') && q.get('clave')) {
    Object.assign(Store.meta, { api: q.get('api'), clave: q.get('clave').toUpperCase() });
    if (q.get('equipo')) Store.meta.deviceName = q.get('equipo');
    Store.meta.demo = false;
    await Store.saveMeta();
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    if (!Store.meta.listo && q.get('equipo')) { render(); await A.conectar(); }
  }
  const ult = Store.get(Store.meta.ultimoCajero);
  ui.user = ult && !ult.pin ? ult.id : null;
  await Store.podar();
  render();
  if (Sync.configurado()) Sync.soon(500);
  if (!VISTA_PREVIA && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
arrancar().catch(e => { $('#app').innerHTML = '<div class="setup"><h1>No se pudo abrir</h1><p>' + esc(e.message) + '</p></div>'; });

window.__panaderia = { Store, Sync, ui, render, saldos, cuentaCaja };
})();
</script>
